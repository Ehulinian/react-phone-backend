AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'phone-catalog-backend as a single Lambda function behind an API Gateway
  HTTP API. Express still does all the routing internally, so this is the same app
  that runs locally with `npm run dev`.

  '
Parameters:
  AllowedOrigins:
    Type: String
    Description: Comma-separated CORS allow-list, e.g. "https://ehulinian.github.io,http://localhost:3000"
    Default: http://localhost:3000
  FrontendUrl:
    Type: String
    Description: Where Stripe Checkout redirects back to after payment.
    Default: http://localhost:3000
  StripeSecretKey:
    Type: String
    Description: Stripe secret key (test mode).
    NoEcho: true
    Default: ''
  OpenAiApiKey:
    Type: String
    Description: OpenAI API key used by the shopping assistant.
    NoEcho: true
    Default: ''
Globals:
  Function:
    Runtime: nodejs20.x
    Architectures:
    - arm64
    MemorySize: 512
    Timeout: 29
Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ApiFunction
      Handler: lambda.handler
      Description: Products, Stripe Checkout and AI assistant endpoints.
      Environment:
        Variables:
          ALLOWED_ORIGINS:
            Ref: AllowedOrigins
          FRONTEND_URL:
            Ref: FrontendUrl
          STRIPE_SECRET_KEY:
            Ref: StripeSecretKey
          OPENAI_API_KEY:
            Ref: OpenAiApiKey
      Events:
        Api:
          Type: HttpApi
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/lambda.ts
        Format: cjs
        Minify: false
        Sourcemap: false
        Target: es2020
      SamResourceId: ApiFunction
Outputs:
  ApiUrl:
    Description: "Base URL of the deployed API \u2014 set this as REACT_APP_API_URL\
      \ in the frontend."
    Value:
      Fn::Sub: https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com
  FunctionName:
    Description: Lambda function name, for `sam logs -n <name>`.
    Value:
      Ref: ApiFunction
